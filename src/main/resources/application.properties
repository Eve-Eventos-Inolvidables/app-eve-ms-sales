spring.application.name=app-eve-ms-sales


# Cargar credenciales
spring.config.import=classpath:config/private.properties,classpath:eve-common-defaults.properties

# DataSource
spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# Swagger
springdoc.api-docs.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Puerto interno específico de este microservicio
server.port=8085
# Dirección del servidor Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# URL base del API Gateway (sobrescribible por entorno)
app.gateway.base-url=${API_GATEWAY_BASE_URL:http://localhost:8080}
app.events.stock-command-key=${SALES_EVENTS_STOCK_COMMAND_KEY:}

# Registrar usando IP en lugar del hostname
eureka.instance.prefer-ip-address=true
logging.level.org.springframework.security=TRACE
# Cache Redis
cache.enabled=true
spring.redis.host=localhost
spring.redis.port=6379
# TTL por región cache
cache.info.ttl-seconds=420
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG


jwt.claim.roles=roles
jwt.claim.user=id
